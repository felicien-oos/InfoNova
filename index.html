<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Info Nova Science</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      margin-top: 30px;
      font-size: 2.5em;
      color: #333;
    }
    .search-container {
      margin: 30px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .avatar {
      width: 50px;
      height: 50px;
      background-image: url('logo.png'); /* Remplace par ton logo */
      background-size: cover;
      border-radius: 50%;
      margin-right: 15px;
    }
    .message {
      font-style: italic;
      color: #666;
      margin-right: 15px;
    }
    input[type="text"] {
      width: 50%;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    #response {
      margin-top: 30px;
      font-size: 1.2em;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Info Nova Science</h1>
  <div class="search-container">
    <div class="avatar" title="Logo InfoNova"></div>
    <div class="message">Pose-moi une question de science</div>
    <input type="text" id="questionInput" placeholder="Ex: Quelle est la formule de l’eau ?" />
  </div>
  <div id="response">🤖</div>

  <script src="data.js"></script>
  <script>
    const input = document.getElementById('questionInput');
    const responseDiv = document.getElementById('response');

    input.addEventListener('input', () => {
      const question = input.value.trim().toLowerCase();
      if (question.length < 3) {
        responseDiv.textContent = '🤖';
        return;
      }

      const found = data.find(item =>
        item.q.toLowerCase().includes(question)
      );
      if (found) {
        responseDiv.textContent = '🧠 ' + found.a;
      } else {
        responseDiv.textContent = '🤷‍♂️ Je ne sais pas encore...';
      }
    });
  </script>
</body>
</html>
