<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfoNova</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    #logo {
      height: 100px;
    }
    #character {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    #character img {
      height: 60px;
      margin-right: 10px;
    }
    #questionBox {
      width: 100%;
      max-width: 600px;
      display: flex;
      margin-bottom: 20px;
    }
    #questionInput {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    #askBtn {
      padding: 10px 20px;
      font-size: 16px;
    }
    #response {
      max-width: 600px;
      text-align: center;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <header>
    <img id="logo" src="logo.png" alt="Logo InfoNova">
    <h1>InfoNova</h1>
  </header>
  <div id="character">
    <img src="logo.png" alt="Personnage">
    <p><strong>Pose-moi une question !</strong></p>
  </div>
  <div id="questionBox">
    <input type="text" id="questionInput" placeholder="Tapez votre question ici...">
    <button id="askBtn">Demander</button>
  </div>
  <div id="response"></div>

  <script>
    const data = {
      "Quelle est la capitale de la France ?": "Paris",
      "Combien de planètes dans le système solaire ?": "8",
      // Ici commence le bloc de 10 000 questions-réponses générées automatiquement
      // Exemple pour la démonstration - les vraies données doivent être générées par lots
      ...Object.fromEntries(Array.from({length: 10000}, (_, i) => [`Question #${i + 1}`, `Réponse #${i + 1}`]))
    };

    const input = document.getElementById("questionInput");
    const response = document.getElementById("response");
    const synth = window.speechSynthesis;

    document.getElementById("askBtn").addEventListener("click", () => {
      const question = input.value.trim();
      const answer = data[question] || "Désolé, je ne connais pas la réponse à cette question.";
      response.textContent = answer;

      const utterance = new SpeechSynthesisUtterance(answer);
      utterance.lang = "fr-FR";
      synth.speak(utterance);
    });
  </script>
</body>
</html>
